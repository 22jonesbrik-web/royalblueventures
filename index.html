<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Blue Ventures | The Ultimate Hub</title>
    <meta name="description"
        content="Royal Blue Ventures offers premium travel planning, destination finder, price estimator, and interactive travel experiences.">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Pacifico&family=Quicksand:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="RBV.css">
    <!-- Twemoji -->
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <style>
        img.emoji {
            height: 1em;
            width: 1em;
            margin: 0 .05em 0 .1em;
            vertical-align: -0.1em;
        }

        /* Minimal top nav override */
        .glass-nav {
            padding: 8px 28px;
            justify-content: center;
            width: fit-content;
            margin: 0 auto;
        }

        /* Footer with logo */
        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 32px 20px 24px;
        }

        footer img.footer-logo {
            height: 52px;
            border-radius: 50%;
            filter: drop-shadow(0 2px 8px rgba(32, 78, 207, 0.2));
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        footer img.footer-logo:hover {
            transform: scale(1.08);
        }

        footer .footer-divider {
            width: 60px;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>

<body>
    <div id="main-nav-container">
        <nav class="glass-nav">
            <div class="nav-links">
                <a href="aboutme.html">About Me</a>
            </div>
        </nav>
    </div>

    <header class="hero-header">
        <div class="hero-image-wrapper">
            <video class="hero-image" autoplay loop muted playsinline video="186115-877653483_small.mp4"
                src="186115-877653483_small.mp4"></video>
        </div>
        <div class="hero-content shifted">
            <h1>Royal Blue Ventures</h1>
            <p class="subtitle">stress free vacations</p>
            <div class="hero-buttons">
                <a href="honeymoonfinder.html" class="cta-button">Plan Your Trip Now →</a>
                <a href="describe-trip.html" class="cta-button secondary-btn">Already Planning →</a>
            </div>
        </div>
    </header>

    <footer>
        <img src="rbv-logo-white.png" alt="Royal Blue Ventures" class="footer-logo">
        <div class="footer-divider"></div>
        <p style="color: #fff; opacity: 0.7;">&copy; 2025 Royal Blue Ventures LLC | Managed by the Executive Suite</p>
    </footer>

    <!-- floating preview removed -->
    <!-- Toggle nav scrolled state for contrast on scroll -->
    <script>
        (function () {
            const navContainer = document.getElementById('main-nav-container');
            if (!navContainer) return;
            const onScroll = () => {
                if (window.scrollY > 40) navContainer.classList.add('scrolled');
                else navContainer.classList.remove('scrolled');
            };
            window.addEventListener('scroll', onScroll, { passive: true });
            document.addEventListener('DOMContentLoaded', onScroll);
        })();
    </script>



    <script>
        document.addEventListener("DOMContentLoaded", function () {
            twemoji.parse(document.body);
        });
    </script>
</body>

</html>
