<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Describe Your Trip | Royal Blue Ventures</title>
    <meta name="description" content="Tell us about your upcoming trip to get started with Royal Blue Ventures.">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="trends-style.css">
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <style>
        /* Form specific enhancements building on trends-style.css */

        #trip-form-container {
            max-width: 820px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .glass-card {
            background: var(--est-card);
            padding: 48px 52px 52px;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(32, 78, 207, 0.06), 0 1px 4px rgba(32, 78, 207, 0.04);
            border: 1px solid var(--est-border);
            position: relative;
            transition: box-shadow 0.4s ease;
        }

        .glass-card:hover {
            box-shadow: 0 8px 40px rgba(32, 78, 207, 0.09), 0 2px 8px rgba(32, 78, 207, 0.05);
        }

        .section-title {
            font-family: var(--font-heading);
            color: var(--est-royal);
            font-size: 1.5rem;
            margin-top: 32px;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--est-border);
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1.5px solid var(--est-border);
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 500;
            background: var(--est-white);
            color: var(--est-royal);
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 1px 3px rgba(32, 78, 207, 0.04);
            resize: vertical;
            min-height: 120px;
            appearance: none;
        }

        textarea:focus {
            border-color: var(--est-royal);
            box-shadow: 0 0 0 3px rgba(32, 78, 207, 0.1);
        }

        textarea::placeholder {
            color: var(--est-muted);
            font-weight: 400;
        }

        .submit-btn-wrapper {
            margin-top: 40px;
        }

        /* Two column layout for larger screens */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row .input-group {
            margin-bottom: 0;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .glass-card {
                padding: 24px 20px 28px;
            }
        }

        img.emoji {
            height: 1em;
            width: 1em;
            margin: 0 .05em 0 .1em;
            vertical-align: -0.1em;
        }

        .required-indicator {
            color: #d9534f;
            margin-left: 3px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="nav-header">
        <nav>
            <a href="index.html">Back to Main Hub</a>
        </nav>
    </div>

    <header class="hero-trends">
        <h1>Plan Your Journey</h1>
        <p>Provide your details below, and let's craft the perfect itinerary.</p>
    </header>

    <div id="trip-form-container">
        <div class="glass-card">
            <!-- 
            Note to developer: 
            To cleanly receive these form submissions, replace the 'action' URL with your own endpoint.
            Services like Formspree (https://formspree.io/) or Formsubmit (https://formsubmit.co/) are great for this.
            Example: action="https://formspree.io/f/your_form_id"
            -->
            <form action="https://formsubmit.co/bridger.jones@fora.travel" method="POST" id="trip-request-form">
                <!-- FormSubmit Settings -->
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="New Trip Request from Royal Blue Ventures!">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_next" value="">

                <h2 class="section-title">Contact Information</h2>

                <div class="input-group">
                    <label for="name">Full Name <span class="required-indicator">*</span></label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="email">Email Address <span class="required-indicator">*</span></label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone Number <span class="required-indicator">*</span></label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </div>

                <h2 class="section-title">Trip Details</h2>

                <div class="input-group">
                    <label for="location">Location / Destination <span class="required-indicator">*</span></label>
                    <input type="text" id="location" name="location" required>
                </div>

                <div class="form-row" style="margin-top: 16px; margin-bottom: 16px;">
                    <div class="input-group">
                        <label for="start-date">Trip Start Date</label>
                        <input type="date" id="start-date" name="start_date">
                    </div>
                    <div class="input-group">
                        <label for="end-date">Trip End Date</label>
                        <input type="date" id="end-date" name="end_date">
                    </div>
                </div>

                <div class="form-row" style="margin-bottom: 16px;">
                    <div class="input-group">
                        <label for="travelers">Number of Travelers <span class="required-indicator">*</span></label>
                        <select id="travelers" name="travelers" required>
                            <option value="" disabled selected>Select number of people</option>
                            <option value="1">1 (Solo)</option>
                            <option value="2">2 (Couple)</option>
                            <option value="3-4">3 - 4 (Small Group/Family)</option>
                            <option value="5+">5+ (Large Group)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="budget">Budget Range (Per Person) <span class="required-indicator">*</span></label>
                        <select id="budget" name="budget" required>
                            <option value="" disabled selected>Select a budget</option>
                            <option value="1500-3000">$1,500 - $3,000</option>
                            <option value="3000-5000">$3,000 - $5,000</option>
                            <option value="5000-10000">$5,000 - $10,000</option>
                            <option value="10000+">$10,000+</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="trip-type">Type of Trip <span class="required-indicator">*</span></label>
                    <select id="trip-type" name="trip_type" required>
                        <option value="" disabled selected>Select trip type</option>
                        <option value="honeymoon">Honeymoon / Romantic Retreat</option>
                        <option value="family">Family Vacation</option>
                        <option value="luxury">Luxury Escape</option>
                        <option value="adventure">Adventure & Exploration</option>
                        <option value="wellness">Wellness Retreat</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="input-group" style="margin-top: 16px;">
                    <label for="notes">Additional Notes</label>
                    <textarea id="notes" name="notes"
                        placeholder="Any special requests, hotel preferences, activities, or dietary restrictions?"></textarea>
                </div>

                <div class="submit-btn-wrapper">
                    <button type="submit" class="calc-btn">Submit Trip Details</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Royal Blue Ventures LLC | Managed by the Executive Suite</p>
    </footer>

    <script>
        // Set the hidden next field to the current URL so it redirects back here upon submission
        document.querySelector('input[name="_next"]').value = window.location.href;

        document.addEventListener("DOMContentLoaded", function () {
            twemoji.parse(document.body);
        });
    </script>
</body>

</html>
