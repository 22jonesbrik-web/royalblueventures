        // Quiz state
        let currentQuestion = 0;
        let scores = {};
        let history = []; // Add history for back button

        // Initialize scores
        for (let dest in destinations) {
            scores[dest] = 0;
        }

        // Load the first question on page load
        window.addEventListener('DOMContentLoaded', loadQuestion);

        function loadQuestion() {
            const question = quizQuestions[currentQuestion];
            document.getElementById('question-text').textContent = question.question;
            document.getElementById('question-count').textContent = `Question ${currentQuestion + 1} of ${quizQuestions.length}`;

            // Update progress bar
            const progress = ((currentQuestion + 1) / quizQuestions.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';

            // Clear previous buttons
            const buttonContainer = document.getElementById('answer-buttons');
            buttonContainer.innerHTML = '';

            // Handle back button visibility
            const backContainer = document.getElementById('back-container');
            backContainer.innerHTML = '';
            if (currentQuestion > 0) {
                const backBtn = document.createElement('button');
                backBtn.className = 'back-btn';
                backBtn.textContent = '← Back';
                backBtn.onclick = goBack;
                backContainer.appendChild(backBtn);
            }

            // Add answer buttons
            question.answers.forEach((answer, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.textContent = answer.text;
                btn.onclick = () => answerQuestion(answer);
                buttonContainer.appendChild(btn);
            });
        }

        function answerQuestion(answer) {
            // Budget questions (0, 1, 2) get 2x weight
            const multiplier = currentQuestion <= 2 ? 2 : 1;

            // Save to history to allow going back
            history.push({ answer: answer, multiplier: multiplier });

            // Add points to destinations
            for (let dest in answer.points) {
                scores[dest] += answer.points[dest] * multiplier;
            }

            currentQuestion++;

            if (currentQuestion < quizQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function goBack() {
            if (currentQuestion > 0) {
                // Remove last action from history
                const lastAction = history.pop();

                // Subtract points
                for (let dest in lastAction.answer.points) {
                    scores[dest] -= lastAction.answer.points[dest] * lastAction.multiplier;
                }

                currentQuestion--;
                loadQuestion();
            }
        }

        function showResults() {
            // Find the destination with the highest score
            let maxScore = 0;
            let winnerDest = '';

            for (let dest in scores) {
                if (scores[dest] > maxScore) {
                    maxScore = scores[dest];
                    winnerDest = dest;
                }
            }

            const winner = destinations[winnerDest];

            // Collect all quiz answers to pass forward
            const quizAnswers = {};
            for (let i = 0; i < history.length; i++) {
                quizAnswers['q' + i] = history[i].answer.text;
            }

            // Build destination result URL
            const params = new URLSearchParams({
                dest: winnerDest,
                name: winner.name,
                desc: winner.description,
                ...quizAnswers
            });
            const resultUrl = 'destination-result.html?' + params.toString();

            // Replace quiz content with "Find" screen (stays in quiz container, no reveal)
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('question-count').textContent = 'All done!';
            document.getElementById('question-text').textContent = "Ready to discover your perfect retreat?";

            const buttonContainer = document.getElementById('answer-buttons');
            buttonContainer.innerHTML = '';
            buttonContainer.style.cssText = 'display: flex; justify-content: center;';
            document.getElementById('back-container').innerHTML = ''; // Hide back button

            const findBtn = document.createElement('a');
            findBtn.href = resultUrl;
            findBtn.className = 'cta-link';
            findBtn.textContent = 'Find Your Retreat';
            buttonContainer.appendChild(findBtn);
        }
